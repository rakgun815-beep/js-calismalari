<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <script>
            //dizi oluştur
            var sayilar=new Array(6);
            for(var i=0; i<6; i++)

            for(var i=0; i<6; i++)
                document.write(i+". eleman:"+sayilar[i]+"<br>");

    </script>
