<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var r = Number(prompt("Yarıçapı girin:"));
        var alan = Math.PI * r * r;
        var cevre = 2 * Math.PI * r;
        document.write("Alan: " + alan.toFixed(2) + "<br>");
        document.write("Çevre: " + cevre.toFixed(2) + "<br>");
    </script>
</body>
</html>
