<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var sayi,kare;
        do {
            sayi=Number(prompt("Sayı giriniz:")); }
            while(sayi<=0);
            kare=sayi*sayi;
            document.write("sayı="+sayi+" sayının karesi="+kare);
    </script>
</body>
</html>
