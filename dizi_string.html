<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            //metin/dizi oluştur
            var kelime="";

            //ekrandan bir kelime al
            kelime=prompt("kelime giriniz:");

            //kelimeyi büyük harflere çevirerek yaz
            document.write(kelime.toUpperCase()+"<br>");

            //kelimenin karakterlerini ekrana yaz
            var boyut=kelime.length;
            for(var i=0; i<boyut; i++)
                document.write(kelime[i]+"<br>");

            //karakterleri tersten yazalım
            for(var i=boyut-1; i>=0; i--)
                document.write(kelime[i]+"<br>");

    </script>
</body>
</html>
