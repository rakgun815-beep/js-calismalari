<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //değişkenleri tanımla
        var r,alan,cevre,pi=3.14;

        //yarıçapı al
        r=Number(prompt("Yarıçap:"));

        //alan ve çevreyi hesapla 
        alan=pi*r*r;
        cevre=2*pi*r;

        //alan ve çevreyi yaz
        alert("Alan="+alan+" Çevre="+cevre);
    </script>
</body>
</html>
