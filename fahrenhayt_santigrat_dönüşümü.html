<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahrenhayt-Santigrat Dönüşümü</title>
</head>
<body>
    <script>
        //önce değişkenlerimi tanımlayalım
        var f,c;

        //fahrenhayt değerini alalım
        f=Number(prompt("Fahrenhayt:"));
        
        //fahrenhayt'ı santigrad'a çevirelim
        c=(f-32)/1.8;

        //işlem sonucunu ekrana yazalım
        alert(f+" Fahrenhayt "+c+" Santigrat");
    </script>
</body>
</html>
