<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //değişkener
        var s,n;

        //n değeri
        n=Number(prompt("n:"));

        //for döngüsü
        for(s=0; s<=n; s=s+5)
        document.write(s+"<br>");

        //while
        s=0;
        while(s<=n) {
            document.write(s+"<br>");
            s=s+5; }


    </script>
</body>
</html>
