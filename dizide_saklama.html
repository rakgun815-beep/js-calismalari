<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            //dizi tanımla
            var sayilar=new Array();

            //dizinin eleman sayısı
            var n=Number(prompt("dizi eleman sayısı:"));

            //dizi elemanlarını oku
            for(var i=0; i<n; i++)
                sayilar[i]=Number(prompt(i+" indisli dizi elemanı:"));

            //diziyi yaz
            document.write(sayilar);
    </script>
</body>
</html>
