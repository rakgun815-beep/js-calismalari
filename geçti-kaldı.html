<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //değişkenler
        var ort,n1,n2;

        //değerleri al
        n1=Number(prompt("Not1:"));
        n2=Number(prompt("Not2:"));

        //ortalama
        ort=(n1+n2)/2;
        
        //sorgu ve işlem
        if(ort<50)
            alert("Ortalama="+ort+" Kaldı!");
        else
             alert("Ortalama="+ort+" Geçti");    
    </script>
</body>
</html>
